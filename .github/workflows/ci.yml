name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  # 手动触发：bot（sync-vendored-sidecar）推送不会递归触发 workflow，
  # 内核重签后需手动跑一次验证（与 core-rs/app 的恢复版一致）。
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # golangci-lint --new-from-rev=HEAD~1 需要至少两个提交的历史
          fetch-depth: 0
          lfs: true
      # contract 测试需要 schema.json。私有仓检出到 $RUNNER_TEMP，
      # 不得放进 module root（TestClosedRustCoreSourceIsNotVendored）。
      - name: Resolve eos-core-rs repo
        id: core_repo
        env:
          SECRET_REPO: ${{ secrets.EOS_CORE_REPO }}
        run: |
          repo="${SECRET_REPO}"
          if [ -z "$repo" ]; then repo="eosaios/eos-core-rs"; fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "core_dir=$RUNNER_TEMP/eos-core-rs" >> "$GITHUB_OUTPUT"
      - name: Checkout eos-core-rs (schema)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.core_repo.outputs.repo }}
          ref: main
          token: ${{ secrets.EOS_CORE_PAT }}
          path: ${{ runner.temp }}/eos-core-rs
      - name: Install system dependencies
        # golang.design/x/clipboard 在 Linux 通过 cgo 绑定 X11 剪贴板，
        # 编译需要 X11 头文件；eos-cli 虽仅 Windows 分发，但 Linux job
        # 仍跑 go build/vet/test 验证编译，必须装 libx11-dev。
        # 另：vendored 内核已切 gnu（动态链接），DT_NEEDED 含 xcap 截图链
        # 的 libxdo/libgbm/libwayland-client/libxcb——e2e 测试 fork/exec
        # 内核，缺运行时库会启动即死（EOF/broken pipe）。
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxdo3 libgbm1 libwayland-client0 libxcb1
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Lint
        # .golangci.yml 已迁移 v2 格式；存量 lint 债（errcheck/dupl/unused 等
        # 历史问题，见 eos-core-rs OPTIMIZATION_BACKLOG.md P2）用 new-from-rev
        # 只卡新增代码，避免首跑即红。存量债清零后移除该参数。
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: --new-from-rev=HEAD~1
      - name: Test
        run: go test ./... -timeout 300s
        env:
          EOS_CORE_RS_DIR: ${{ runner.temp }}/eos-core-rs
      - name: Verify packaged and embedded CLI runtime
        shell: bash
        run: |
          go build -trimpath -o "$RUNNER_TEMP/eos-runtime-gate/eos" .
          python3 scripts/verify_release_runtime.py \
            --cli "$RUNNER_TEMP/eos-runtime-gate/eos" \
            --core-dir pkg/coreapi/sidecar/core/x86_64-unknown-linux-gnu

  # macOS keeps the install.sh symlink in os.Executable; validate the native
  # installation path and provider contract before release packaging.
  macos-runtime:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # aarch64-apple-darwin/eos-core 走 Git LFS；默认 checkout 只留下
          # pointer，go:embed / VerifyBinary 会对上错误的 sha256。
          lfs: true
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Test native CLI contracts and runtime
        run: go test ./pkg/coreapi/sidecar ./internal/headless ./internal/ui/adapter ./pkg/attachments -timeout 300s
      - name: Verify packaged and embedded CLI runtime (macOS)
        run: |
          go build -trimpath -o "$RUNNER_TEMP/eos-runtime-gate/eos" .
          python3 scripts/verify_release_runtime.py \
            --cli "$RUNNER_TEMP/eos-runtime-gate/eos" \
            --core-dir pkg/coreapi/sidecar/core/aarch64-apple-darwin

  # Windows native build and embedded/archive runtime validation.
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Resolve eos-core-rs repo
        id: core_repo
        shell: bash
        env:
          SECRET_REPO: ${{ secrets.EOS_CORE_REPO }}
        run: |
          repo="${SECRET_REPO}"
          if [ -z "$repo" ]; then repo="eosaios/eos-core-rs"; fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
      - name: Checkout eos-core-rs (schema)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.core_repo.outputs.repo }}
          ref: main
          token: ${{ secrets.EOS_CORE_PAT }}
          path: ${{ runner.temp }}/eos-core-rs
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Build (Windows)
        run: go build ./...
      - name: Test (Windows)
        shell: bash
        run: go test ./... -timeout 300s
        env:
          EOS_CORE_RS_DIR: ${{ runner.temp }}/eos-core-rs
      - name: Verify packaged and embedded CLI runtime (Windows)
        shell: pwsh
        run: |
          go build -trimpath -o "$env:RUNNER_TEMP/eos-runtime-gate/eos.exe" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_release_runtime.py `
            --cli "$env:RUNNER_TEMP/eos-runtime-gate/eos.exe" `
            --core-dir pkg/coreapi/sidecar/core/x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # 打补丁重建 Linux/Windows sidecar（SEC-02 symlink canonicalize），签名后上传
  # artifact，由 agent 下载并 vendored 进本 PR。不直接 push，避免污染 main 同步流。
  rebuild-patched-sidecar:
    name: Rebuild patched sidecar (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-pc-windows-gnu
            runner: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resolve eos-core-rs repo
        id: core_repo
        shell: bash
        env:
          SECRET_REPO: ${{ secrets.EOS_CORE_REPO }}
        run: |
          repo="${SECRET_REPO}"
          if [ -z "$repo" ]; then repo="eosaios/eos-core-rs"; fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
      - name: Checkout eos-core-rs
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.core_repo.outputs.repo }}
          ref: main
          token: ${{ secrets.EOS_CORE_PAT }}
          path: eos-core-rs
      - name: Patch sandbox symlink canonicalize
        shell: bash
        run: |
          python3 scripts/patch_sandbox_symlink_canonicalize.py \
            eos-core-rs/crates/eos-core-sandbox/src/lib.rs
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install Linux system deps (xcap chain)
        if: contains(matrix.target, 'linux')
        run: sudo apt-get update && sudo apt-get install -y pkg-config libpipewire-0.3-dev libdrm-dev libgbm-dev libwayland-dev libxdo-dev libegl-dev
      - name: Build (release)
        working-directory: eos-core-rs
        run: cargo build --release --target ${{ matrix.target }} -p eos-core-bin
      - name: Sign and package
        shell: pwsh
        working-directory: eos-core-rs
        env:
          EOS_SIGNING_KEY: ${{ secrets.EOS_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EOS_SIGNING_KEY)) {
            throw "EOS_SIGNING_KEY secret 未设置"
          }
          $exeName = if ("${{ matrix.target }}" -like "*windows*") { "eos-core.exe" } else { "eos-core" }
          $built = "target/${{ matrix.target }}/release/$exeName"
          $staged = "target/release/$exeName"
          New-Item -ItemType Directory -Force -Path (Split-Path $staged) | Out-Null
          Copy-Item -Force $built $staged
          New-Item -ItemType Directory -Force -Path scripts | Out-Null
          [IO.File]::WriteAllText("$PWD/scripts/eos-signing-key.pem", $env:EOS_SIGNING_KEY)
          & pwsh -NoProfile -File scripts/package-public-artifact.ps1 `
            -Target "${{ matrix.target }}" `
            -PrivateKeyPath scripts/eos-signing-key.pem
      - name: Stage packaged sidecar into eos layout
        shell: bash
        run: |
          set -euo pipefail
          dest="pkg/coreapi/sidecar/core/${{ matrix.target }}"
          mkdir -p "$dest"
          # package-public-artifact writes into eos-core-rs/pkg/... or cwd pkg?
          # Align with sync-vendored-sidecar: look under eos-core-rs first.
          src=""
          for candidate in \
            "eos-core-rs/pkg/coreapi/sidecar/core/${{ matrix.target }}" \
            "pkg/coreapi/sidecar/core/${{ matrix.target }}"; do
            if [ -f "$candidate/manifest.json" ]; then src="$candidate"; break; fi
          done
          if [ -z "$src" ]; then
            echo "::error::packaged sidecar not found for ${{ matrix.target }}"
            find eos-core-rs -name manifest.json | head
            exit 1
          fi
          cp -f "$src"/eos-core* "$dest/" 2>/dev/null || true
          cp -f "$src/manifest.json" "$dest/"
          ls -la "$dest"
      - uses: actions/upload-artifact@v4
        with:
          name: patched-sidecar-${{ matrix.target }}
          path: pkg/coreapi/sidecar/core/${{ matrix.target }}/
          if-no-files-found: error
