name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  # 手动触发：bot（sync-vendored-sidecar）推送不会递归触发 workflow，
  # 内核重签后需手动跑一次验证（与 core-rs/app 的恢复版一致）。
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # golangci-lint --new-from-rev=HEAD~1 需要至少两个提交的历史
          fetch-depth: 0
          lfs: true
      - name: Install system dependencies
        # golang.design/x/clipboard 在 Linux 通过 cgo 绑定 X11 剪贴板，
        # 编译需要 X11 头文件；eos-cli 虽仅 Windows 分发，但 Linux job
        # 仍跑 go build/vet/test 验证编译，必须装 libx11-dev。
        # 另：vendored 内核已切 gnu（动态链接），DT_NEEDED 含 xcap 截图链
        # 的 libxdo/libgbm/libwayland-client/libxcb——e2e 测试 fork/exec
        # 内核，缺运行时库会启动即死（EOF/broken pipe）。
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxdo3 libgbm1 libwayland-client0 libxcb1
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Lint
        # .golangci.yml 已迁移 v2 格式；存量 lint 债（errcheck/dupl/unused 等
        # 历史问题，见 eos-core-rs OPTIMIZATION_BACKLOG.md P2）用 new-from-rev
        # 只卡新增代码，避免首跑即红。存量债清零后移除该参数。
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: --new-from-rev=HEAD~1
      - name: Test
        run: go test ./... -timeout 300s

  # Windows：eos-cli 目前仅 Windows 分发，验证 Windows 编译。
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Build (Windows)
        run: go build ./...
      - name: Test (Windows)
        run: go test ./... -timeout 300s
