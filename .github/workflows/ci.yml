name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  # 手动触发：bot（sync-vendored-sidecar）推送不会递归触发 workflow，
  # 内核重签后需手动跑一次验证（与 core-rs/app 的恢复版一致）。
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # golangci-lint --new-from-rev=HEAD~1 需要至少两个提交的历史
          fetch-depth: 0
          lfs: true
      - name: Install system dependencies
        # golang.design/x/clipboard 在 Linux 通过 cgo 绑定 X11 剪贴板，
        # 编译需要 X11 头文件；eos-cli 虽仅 Windows 分发，但 Linux job
        # 仍跑 go build/vet/test 验证编译，必须装 libx11-dev。
        # 另：vendored 内核已切 gnu（动态链接），DT_NEEDED 含 xcap 截图链
        # 的 libxdo/libgbm/libwayland-client/libxcb——e2e 测试 fork/exec
        # 内核，缺运行时库会启动即死（EOF/broken pipe）。
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxdo3 libgbm1 libwayland-client0 libxcb1
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Test release core pairing guard
        run: python3 -m unittest discover -s scripts -p test_verify_release_core.py
      - name: Test Bash installation channels
        run: python3 scripts/test_install_channels.py
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Lint
        # .golangci.yml 已迁移 v2 格式；存量 lint 债（errcheck/dupl/unused 等
        # 历史问题，见 eos-core-rs OPTIMIZATION_BACKLOG.md P2）用 new-from-rev
        # 只卡新增代码，避免首跑即红。存量债清零后移除该参数。
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: --new-from-rev=HEAD~1
      # Contract CT-01 读 third_party/eos-core-protocol/schema.json（仓库内锚点）。
      # 不在此 job 检出完整 eos-core-rs：actions/checkout 的 path 必须在
      # GITHUB_WORKSPACE 下，而放进 module root 会触发
      # TestClosedRustCoreSourceIsNotVendored。
      - name: Test
        run: go test ./... -timeout 300s
      - name: Verify packaged and embedded CLI runtime
        shell: bash
        run: |
          go build -trimpath -o "$RUNNER_TEMP/eos-runtime-gate/eos" .
          python3 scripts/verify_release_runtime.py \
            --cli "$RUNNER_TEMP/eos-runtime-gate/eos" \
            --core-dir pkg/coreapi/sidecar/core/x86_64-unknown-linux-gnu

  # macOS keeps the install.sh symlink in os.Executable; validate the native
  # installation path and provider contract before release packaging.
  macos-runtime:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # aarch64-apple-darwin/eos-core 走 Git LFS；默认 checkout 只留下
          # pointer，go:embed / VerifyBinary 会对上错误的 sha256。
          lfs: true
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Test Bash installation channels
        run: python3 scripts/test_install_channels.py
      - name: Test native CLI contracts and runtime
        run: go test ./pkg/coreapi/sidecar ./internal/headless ./internal/ui/adapter ./pkg/attachments -timeout 300s
      - name: Verify packaged and embedded CLI runtime (macOS)
        run: |
          go build -trimpath -o "$RUNNER_TEMP/eos-runtime-gate/eos" .
          python3 scripts/verify_release_runtime.py \
            --cli "$RUNNER_TEMP/eos-runtime-gate/eos" \
            --core-dir pkg/coreapi/sidecar/core/aarch64-apple-darwin

  # Windows native build and embedded/archive runtime validation.
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Test PowerShell installation channels
        shell: pwsh
        run: ./scripts/test_install_channels.ps1
      - name: Build (Windows)
        run: go build ./...
      - name: Test (Windows)
        run: go test ./... -timeout 300s
      - name: Verify packaged and embedded CLI runtime (Windows)
        shell: pwsh
        run: |
          go build -trimpath -o "$env:RUNNER_TEMP/eos-runtime-gate/eos.exe" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_release_runtime.py `
            --cli "$env:RUNNER_TEMP/eos-runtime-gate/eos.exe" `
            --core-dir pkg/coreapi/sidecar/core/x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
