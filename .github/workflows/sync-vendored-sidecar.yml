name: Sync Vendored Sidecar

# 跨平台自动构建 + 签名 + vendored 同步 eos-core sidecar 到 eos-cli（+ eos-app）。
#
# 为什么用 CI 而非本机交叉编译：
#   - macOS：本机 Windows 无法交叉编译（缺 macOS SDK，法律+技术双重不可行）。
#   - Linux：需 zig + 改 reqwest 为 rustls 才能交叉编译，工具链成本高。
#   - 原生 runner CI 是唯一可行路径，与 codex（rust-release.yml）、eos-core-rs
#     （build-multiplatform.yml）的设计一致。
#
# 流程：
#   build job（5 target 矩阵，各在原生 runner）：
#     checkout eos-core-rs → cargo build --release → 写签名 key（secret）→
#     package-public-artifact.ps1 签名打包 → 校验 sha256 → upload-artifact。
#   sync job（依赖 build）：
#     download 5 artifact → 摆进 eos-cli pkg/coreapi/sidecar/core/<triple>/ →
#     （可选）同步到 eos-app core/<triple>/ + output/core/<triple>/ →
#     git commit + push 回仓库。
#
# 触发：手动 workflow_dispatch（可选单 target，或仅 sync 用已有 artifact）。

on:
  workflow_dispatch:
    inputs:
      target:
        description: "只构建单个目标（留空构建全部 5 个）"
        type: choice
        options:
          - ""
          - x86_64-pc-windows-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
        default: ""
      core_repo:
        description: "eos-core-rs 仓库（owner/name），默认用 secret EOS_CORE_REPO"
        required: false
        default: ""
      bypass_cache:
        description: "跳过 rust-cache 全量重编（诊断缓存污染交叉编译产物）"
        type: boolean
        default: false
      sync_app:
        description: "同步到下游 eos-app 仓库（需 EOS_APP_DEPLOY_KEY）"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write   # sync job 需 push 回 eos-cli 仓库

jobs:
  # ── resolve：按 input 过滤 target，动态生成 build matrix ──
  # （job 级 if: 不允许引用 matrix 上下文——此前的一处文件级错误，
  #   GitHub 校验直接拒绝整个 workflow，表现为每次 push 都产生 0s 失败。
  #   故改为前置 job 计算 matrix，build 不再需要 job 级 if。）
  resolve:
    name: Resolve targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set.outputs.targets }}
    steps:
      - id: set
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: |
          if [ -z "$TARGET" ]; then
            echo 'targets=["x86_64-pc-windows-gnu","x86_64-apple-darwin","aarch64-apple-darwin","x86_64-unknown-linux-gnu","aarch64-unknown-linux-gnu"]' >> "$GITHUB_OUTPUT"
          else
            echo "targets=[\"$TARGET\"]" >> "$GITHUB_OUTPUT"
          fi

  # ── build：各 target 在原生 runner 编译 + 签名打包 + 上传 artifact ──
  build:
    name: Build (${{ matrix.target }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}
        include:
          - target: x86_64-pc-windows-gnu
            runner: windows-latest
          - target: x86_64-apple-darwin
            runner: macos-latest   # macos-13（x86_64 runner）已退役，ARM runner 交叉编
          - target: aarch64-apple-darwin
            runner: macos-latest
          # Linux 内核目标 musl→gnu（对齐 release.yml）：内核截图链 xcap→
          # wayland/drm/gbm/pipewire 的 -sys 系统库探测在 musl 交叉编译下必败
          # （无 dlopen 开关）；gnu 在原生 runner 上构建，glibc 地板天然存在。
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm

    steps:
      - name: Resolve eos-core-rs repo
        id: repo
        shell: bash
        env:
          INPUT_REPO: ${{ github.event.inputs.core_repo }}
          SECRET_REPO: ${{ secrets.EOS_CORE_REPO }}
        run: |
          repo="${INPUT_REPO}"
          if [ -z "$repo" ]; then repo="${SECRET_REPO}"; fi
          if [ -z "$repo" ]; then repo="eosaios/eos-core-rs"; fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "Using eos-core-rs repo: $repo"

      - name: Checkout eos-core-rs
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repo.outputs.repo }}
          token: ${{ secrets.EOS_CORE_PAT }}   # 私有仓需 PAT，公开仓留空即可

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      # xcap 截图链（wayland/drm/gbm/pipewire/xdo/egl）的 -sys crate 无
      # dlopen 逃生门，gnu 原生构建也需 pkg-config 探测 + 链接系统 dev 库，
      # 与 release.yml 的 Linux 步骤保持一致。
      - name: Install Linux system deps (xcap chain)
        if: contains(matrix.target, 'linux')
        run: sudo apt-get update && sudo apt-get install -y pkg-config libpipewire-0.3-dev libdrm-dev libgbm-dev libwayland-dev libxdo-dev libegl-dev

      - uses: Swatinem/rust-cache@v2
        if: ${{ github.event.inputs.bypass_cache != 'true' }}
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }} -p eos-core-bin

      # 内置 catalog 完整性门禁：编译产物必须含当前源码的 MiniMax anthropic
      # 端点字面量。2026-08-20 实测 x86_64-apple-darwin 交叉编译产物缺失该
      # 字符串（原生 arm64 / gnu / windows 均正常），已定位到工具链层且无
      # Intel 设备跟进，产品决策暂搁置：该目标门禁降级为告警，不阻塞其余
      # 平台的 vendored 同步；其余目标缺失/陈旧仍 fail-fast。
      - name: Verify builtin catalog marker in built binary
        shell: bash
        run: |
          set -euo pipefail
          exe="target/${{ matrix.target }}/release/eos-core"
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-gnu" ]; then exe="${exe}.exe"; fi
          echo "checking: $exe"
          fail_hard=true
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            fail_hard=false
            echo "::notice::darwin-amd64 为已知交叉编译异常目标（2026-08-20），catalog 门禁降级为告警"
          fi
          if grep -aq 'api.minimaxi.com/anthropic/v1' "$exe"; then
            msg="内置 catalog 是旧版（含 anthropic/v1 旧端点）——疑似非当前源码构建"
            if $fail_hard; then echo "::error::$msg"; exit 1; else echo "::warning::$msg"; fi
          fi
          if ! grep -aq 'api.minimaxi.com/anthropic' "$exe"; then
            msg="内置 catalog 端点字面量缺失（交叉编译/链接异常）"
            count="$(grep -aoc minimaxi "$exe" || echo 0)"
            if $fail_hard; then echo "::error::$msg"; echo "minimaxi 出现次数: $count"; exit 1
            else echo "::warning::$msg (minimaxi 出现次数: $count)"; fi
          fi
          echo "catalog marker check done"

      - name: Sign and package
        shell: pwsh
        env:
          EOS_SIGNING_KEY: ${{ secrets.EOS_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EOS_SIGNING_KEY)) {
            throw "EOS_SIGNING_KEY secret 未设置"
          }
          $exeName = if ("${{ matrix.target }}" -like "*windows*") { "eos-core.exe" } else { "eos-core" }
          # package 脚本读 target/release/<exe>，target 构建产物在
          # target/<target>/release/<exe>，复制到 package 脚本期望位置。
          $built = "target/${{ matrix.target }}/release/$exeName"
          $staged = "target/release/$exeName"
          New-Item -ItemType Directory -Force -Path (Split-Path $staged) | Out-Null
          Copy-Item -Force $built $staged
          New-Item -ItemType Directory -Force -Path scripts | Out-Null
          [IO.File]::WriteAllText("$PWD/scripts/eos-signing-key.pem", $env:EOS_SIGNING_KEY)
          & pwsh -NoProfile -File scripts/package-public-artifact.ps1 `
            -Target "${{ matrix.target }}" `
            -PrivateKeyPath scripts/eos-signing-key.pem

      - name: Verify sha256
        shell: pwsh
        run: |
          $exeName = if ("${{ matrix.target }}" -like "*windows*") { "eos-core.exe" } else { "eos-core" }
          $dest = "pkg/coreapi/sidecar/core/${{ matrix.target }}"
          $manifest = Get-Content "$dest/manifest.json" -Raw | ConvertFrom-Json
          $manifestHash = ($manifest.sha256 -replace "^sha256:", "").ToLowerInvariant()
          $actualHash = (Get-FileHash -Algorithm SHA256 "$dest/$exeName").Hash.ToLowerInvariant()
          Write-Host "manifest: $manifestHash"
          Write-Host "binary  : $actualHash"
          if ($manifestHash -ne $actualHash) { throw "sha256 不一致" }
          Write-Host "sha256 一致"

      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: pkg/coreapi/sidecar/core/${{ matrix.target }}/
          if-no-files-found: error

  # ── sync：下载全部 artifact → 分发到 eos-cli（+ eos-app）→ commit + push ──
  sync:
    name: Sync vendored sidecar
    runs-on: ubuntu-latest
    needs: build
    # 仅全部 build 成功才同步（原 !cancelled() 会在失败时也同步，违背语义）
    if: success()
    # 只在所有 build 都成功（或被 input 过滤跳过）时同步
    steps:
      - name: Checkout eos-cli
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download all sidecar artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-sidecars
          pattern: sidecar-*
          merge-multiple: false

      - name: Distribute artifacts to eos-cli vendored dir
        run: |
          set -euo pipefail
          core_dir="pkg/coreapi/sidecar/core"
          for dir in downloaded-sidecars/sidecar-*; do
            [ -d "$dir" ] || continue
            target=$(basename "$dir" | sed 's/^sidecar-//')
            dest="$core_dir/$target"
            mkdir -p "$dest"
            cp -f "$dir/eos-core"* "$dest/" 2>/dev/null || cp -f "$dir/"* "$dest/"
            cp -f "$dir/manifest.json" "$dest/"
            echo "distributed -> $dest"
          done

      - name: Verify all sha256 match
        run: |
          set -euo pipefail
          core_dir="pkg/coreapi/sidecar/core"
          for target_dir in "$core_dir"/*/; do
            [ -f "$target_dir/manifest.json" ] || continue
            manifest_hash=$(python3 -c "import json,sys; print(json.load(open('${target_dir}manifest.json'))['sha256'].replace('sha256:','').lower())")
            bin_file=$(ls "$target_dir"eos-core* | head -1)
            actual_hash=$(sha256sum "$bin_file" | awk '{print $1}' | tr 'A-Z' 'a-z}')
            target=$(basename "$target_dir")
            echo "$target: manifest=$manifest_hash binary=$actual_hash"
            if [ "$manifest_hash" != "$actual_hash" ]; then
              echo "::error::$target sha256 不一致"; exit 1
            fi
          done
          echo "全部 sha256 一致"

      - name: Commit and push to eos-cli
        run: |
          git add pkg/coreapi/sidecar/core/*/eos-core* pkg/coreapi/sidecar/core/*/manifest.json
          # Unix 二进制必须以 100755 提交：CI 的 vendored e2e 测试直接
          # fork/exec 内核；artifact 下载不保 mode，漏掉会 permission denied。
          for bin in pkg/coreapi/sidecar/core/*/eos-core; do
            [ -f "$bin" ] || continue
            git update-index --chmod=+x "$bin"
          done
          if git diff --staged --quiet; then
            echo "无变更，跳过 commit"
          else
            git commit -m "ci(sidecar): 同步 vendored 多平台 sidecar

          由 sync-vendored-sidecar.yml CI 自动产出：各 target 在原生 runner
          编译 + Ed25519 签名 + 校验 sha256 后 vendored。勿手动编辑。

          包含 target：$(ls pkg/coreapi/sidecar/core/ | tr '\n' ' ')"
            git push
            echo "已 push 到 eos-cli"
          fi

      # ── 可选：同步到下游 eos-app 仓库 ──
      # 注意：secrets 上下文不允许出现在 if: 条件里（GitHub 会拒绝整个 workflow
      # 文件，这正是此前一触发即 0s 失败的原因），key 是否存在改在 run 内判断。
      - name: Sync to eos-app (downstream)
        if: ${{ github.event.inputs.sync_app == 'true' }}
        env:
          EOS_APP_GIT_URL: ${{ secrets.EOS_APP_GIT_URL }}
          EOS_APP_DEPLOY_KEY: ${{ secrets.EOS_APP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$EOS_APP_DEPLOY_KEY" ]; then
            echo "::warning::EOS_APP_DEPLOY_KEY secret 未设置，跳过 eos-app 同步"
            exit 0
          fi
          if [ -z "$EOS_APP_GIT_URL" ]; then
            echo "::warning::EOS_APP_GIT_URL secret 未设置，跳过 eos-app 同步"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "${{ secrets.EOS_APP_DEPLOY_KEY }}" > ~/.ssh/eos_app_key
          chmod 600 ~/.ssh/eos_app_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/eos_app_key -o StrictHostKeyChecking=no"
          git clone "$EOS_APP_GIT_URL" eos-app-sync
          cd eos-app-sync
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          core_dir="../pkg/coreapi/sidecar/core"
          for target_dir in "$core_dir"/*/; do
            [ -f "$target_dir/manifest.json" ] || continue
            target=$(basename "$target_dir")
            for sub in core "output/core"; do
              dest="$sub/$target"
              mkdir -p "$dest"
              cp -f "$target_dir"eos-core* "$dest/" 2>/dev/null || cp -f "$target_dir"* "$dest/"
              cp -f "$target_dir/manifest.json" "$dest/"
            done
          done
          git add core/*/eos-core* core/*/manifest.json output/core/*/eos-core* output/core/*/manifest.json
          if git diff --staged --quiet; then
            echo "eos-app 无变更"
          else
            git commit -m "ci(sidecar): 同步 vendored 多平台 sidecar"
            git push
            echo "已 push 到 eos-app"
          fi
