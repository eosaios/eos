name: Fetch core-rs sources (temp)

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout eos-core-rs
        uses: actions/checkout@v4
        with:
          repository: eosaios/eos-core-rs
          ref: main
          token: ${{ secrets.EOS_CORE_PAT }}
          path: eos-core-rs
      - name: Pack sources of interest
        run: |
          set -euo pipefail
          mkdir -p out
          cp eos-core-rs/crates/eos-core-protocol/schema.json out/schema.json
          # Collect path/sandbox/approval related rust sources
          rg -l -i 'symlink|canonical|writable_root|approval|file_mkdir|path_escape|landlock' \
            eos-core-rs/crates --glob '*.rs' > out/filelist.txt || true
          mkdir -p out/sources
          while IFS= read -r f; do
            rel="${f#eos-core-rs/}"
            mkdir -p "out/sources/$(dirname "$rel")"
            cp "$f" "out/sources/$rel"
          done < out/filelist.txt
          # Also grab sandbox crate tree lightly
          if [ -d eos-core-rs/crates/eos-core-sandbox ]; then
            cp -a eos-core-rs/crates/eos-core-sandbox out/sources/crates/eos-core-sandbox
          fi
          # tools mkdir
          find eos-core-rs/crates -iname '*mkdir*' -o -iname '*path*guard*' -o -iname '*sandbox*' 2>/dev/null | head -100 >> out/filelist2.txt || true
          tar -C out -czf core-sources.tgz schema.json filelist.txt sources
          ls -la core-sources.tgz out/schema.json
          wc -l out/filelist.txt
      - uses: actions/upload-artifact@v4
        with:
          name: core-rs-sources
          path: core-sources.tgz
