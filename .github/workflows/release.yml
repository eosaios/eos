name: Release

# CLI 三端（Windows / macOS / Linux × amd64+arm64）生产包构建。
#
# 流程（每 target 原生 runner）：
#   checkout eos-cli + eos-core-rs（私有仓，PAT）→ cargo 构建 sidecar →
#   Ed25519 签名打包 → 校验 sha256 → go build CLI（版本注入）→
#   组装 release 布局（eos(.exe) + core/<triple>/）→ 打包归档 → upload。
# release job：聚合 5 个归档 + 生成 SHA256SUMS.txt → 创建 GitHub Release。
#
# 触发：手动 workflow_dispatch（输入版本号）或推送 v* tag（tag 名即版本号）。
# 前置 secrets：EOS_CORE_PAT（可读私有仓 eosaios/eos-core-rs）、
# EOS_SIGNING_KEY（Ed25519 签名私钥 PEM 全文）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v1.0.0-beta.3，留空则拒绝）"
        required: true
        default: ""
      core_ref:
        description: "eos-core-rs 构建 ref（默认 main）"
        required: false
        default: "main"
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13（x86_64 runner）已退役：darwin/amd64 在 macos-latest（ARM）
          # 上交叉编译（cargo --target / GOARCH=amd64 + clang -arch x86_64）。
          - { goos: windows, goarch: amd64, runner: windows-latest, triple: x86_64-pc-windows-gnu }
          - { goos: darwin, goarch: amd64, runner: macos-latest, triple: x86_64-apple-darwin }
          - { goos: darwin, goarch: arm64, runner: macos-latest, triple: aarch64-apple-darwin }
          # Linux 内核目标 musl→gnu：内核截图链 xcap→wayland/drm/gbm/pipewire
          # 系统库探测在 musl 交叉下必败（无 dlopen 开关）。CLI 的 Go 主程序
          # 本就带 CGO（X11 剪贴板）构建在 ubuntu-24.04 runner，glibc ≥2.39
          # 地板早已存在，musl 内核是包内唯一静态件，换 gnu 实际零兼容性损失。
          - { goos: linux, goarch: amd64, runner: ubuntu-latest, triple: x86_64-unknown-linux-gnu }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu }

    steps:
      - name: Checkout eos-cli
        uses: actions/checkout@v4

      - name: Checkout eos-core-rs (private)
        uses: actions/checkout@v4
        with:
          repository: eosaios/eos-core-rs
          ref: ${{ inputs.core_ref || 'main' }}
          token: ${{ secrets.EOS_CORE_PAT }}
          path: eos-core-rs

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Install Rust target
        run: rustup target add ${{ matrix.triple }}

      # X11 供 CLI Go 侧剪贴板；pipewire/drm/gbm/wayland/xdo 供内核 xcap
      # 截图链的 pkg-config 探测与链接（-sys crate 无 dlopen 逃生门）。

      # golang.design/x/clipboard 在 Linux 走 cgo 绑定 X11，编译需要头文件。
      - name: Install X11 headers (linux)
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev pkg-config libpipewire-0.3-dev libdrm-dev libgbm-dev libwayland-dev libxdo-dev libegl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: eos-core-rs
          key: ${{ matrix.triple }}

      - name: Build sidecar (release)
        working-directory: eos-core-rs
        run: cargo build --release --target ${{ matrix.triple }} -p eos-core-bin

      - name: Sign and package sidecar
        shell: pwsh
        working-directory: eos-core-rs
        env:
          EOS_SIGNING_KEY: ${{ secrets.EOS_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EOS_SIGNING_KEY)) {
            throw "EOS_SIGNING_KEY secret 未设置"
          }
          $exeName = if ("${{ matrix.goos }}" -eq "windows") { "eos-core.exe" } else { "eos-core" }
          # package 脚本读 target/release/<exe>，target 构建产物在
          # target/<target>/release/<exe>，复制到脚本期望位置。
          $built = "target/${{ matrix.triple }}/release/$exeName"
          $staged = "target/release/$exeName"
          New-Item -ItemType Directory -Force -Path (Split-Path $staged) | Out-Null
          Copy-Item -Force $built $staged
          New-Item -ItemType Directory -Force -Path scripts | Out-Null
          [IO.File]::WriteAllText("$PWD/scripts/eos-signing-key.pem", $env:EOS_SIGNING_KEY)
          & pwsh -NoProfile -File scripts/package-public-artifact.ps1 `
            -Target "${{ matrix.triple }}" `
            -PrivateKeyPath scripts/eos-signing-key.pem

      - name: Verify sidecar sha256
        shell: bash
        run: |
          set -euo pipefail
          dest="eos-core-rs/pkg/coreapi/sidecar/core/${{ matrix.triple }}"
          manifest_hash=$(python3 -c "import json; print(json.load(open('$dest/manifest.json'))['sha256'].replace('sha256:','').lower())" 2>/dev/null \
            || jq -r '.sha256' "$dest/manifest.json" | sed 's/^sha256://' | tr 'A-Z' 'a-z')
          bin_file=$(ls "$dest"/eos-core* | head -1)
          actual_hash=$(sha256sum "$bin_file" | awk '{print $1}')
          echo "manifest=$manifest_hash binary=$actual_hash"
          [ "$manifest_hash" = "$actual_hash" ] || { echo "::error::sha256 不一致"; exit 1; }

      - name: Build CLI and assemble archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version || github.ref_name }}"
          [ -n "$VERSION" ] || { echo "::error::版本号为空"; exit 1; }
          COMMIT="${{ github.sha }}"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          GOOS_T="${{ matrix.goos }}"
          BIN="eos"; [ "$GOOS_T" = "windows" ] && BIN="eos.exe"
          STAGE="eos-cli_${VERSION}_${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "dist/$STAGE/core/${{ matrix.triple }}"
          # 目标三元组显式下发（native runner 上与宿主一致；darwin/amd64 为交叉）。
          export CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}
          if [ "${{ matrix.goos }}/${{ matrix.goarch }}" = "darwin/amd64" ]; then
            export CC="clang -arch x86_64"
          fi
          go build -trimpath \
            -ldflags "-s -w -X github.com/eosaios/eos/internal/version.AppVersion=$VERSION -X github.com/eosaios/eos/internal/version.BuildCommit=$COMMIT -X github.com/eosaios/eos/internal/version.BuildDate=$DATE" \
            -o "dist/$STAGE/$BIN" .
          cp "eos-core-rs/pkg/coreapi/sidecar/core/${{ matrix.triple }}"/eos-core* "dist/$STAGE/core/${{ matrix.triple }}/"
          cp "eos-core-rs/pkg/coreapi/sidecar/core/${{ matrix.triple }}/manifest.json" "dist/$STAGE/core/${{ matrix.triple }}/"
          cd dist
          if [ "$GOOS_T" = "windows" ]; then
            # 不用 powershell Compress-Archive（反斜杠条目）也不用 GNU tar
            # -a（Git Bash 下产出裸 tar 无 zip 结构）——用仓库内 Python 脚本
            # 显式写 POSIX '/' 条目 + 目录条目（ZIP 规范；eos update 解压
            # 只认正斜杠目录条目）。
            python "$GITHUB_WORKSPACE/scripts/pack_zip.py" "$STAGE"
          else
            tar -czf "$STAGE.tar.gz" "$STAGE"
          fi
          rm -rf "$STAGE"
          echo "== dist =="; ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          gh release create "$VERSION" dist/* \
            --title "EOS CLI $VERSION" \
            --notes "三端生产包（Windows / macOS / Linux），内核为构建时 eos-core-rs 指定 ref 的签名产物。校验见 SHA256SUMS.txt。" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null \
          || gh release upload "$VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  winget:
    # 发版后自动向 microsoft/winget-pkgs 提 manifest 更新 PR。
    # 前置：仓库 Settings → Secrets → 新建 WINGET_TOKEN（classic PAT，
    # 勾选 public_repo；用提交 winget PR 的 GitHub 账号生成，
    # 注意 PAT 过期后本 job 会失败，需要换新）。
    # 首次手动提交的 manifest 合并后，本 job 才会成功（包需已存在于 winget）。
    name: Submit to winget-pkgs
    runs-on: windows-latest
    needs: release
    if: ${{ vars.WINGET_SUBMIT != 'off' }}
    steps:
      - name: Download wingetcreate
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile wingetcreate.exe -UseBasicParsing
          $ProgressPreference = "SilentlyContinue"

      - name: Submit manifest update
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $VERSION = "${{ inputs.version || github.ref_name }}"
          $verNum = $VERSION.TrimStart("v")
          wingetcreate.exe update EOSAIOS.EOSCLI `
            --version $verNum `
            --urls "https://github.com/${{ github.repository }}/releases/download/$VERSION/eos-cli_v${verNum}_windows-amd64.zip" `
            --token $env:WINGET_TOKEN `
            --submit

